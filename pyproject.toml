[project]
name = "phishing-triage"
version = "0.1.0"
description = "Triage a reported phishing email the way an L1 SOC analyst would, using reputation lookups only."
readme = "README.md"
authors = [
    { name = "Jack", email = "181964304+GiacomoBarry@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
]

[project.scripts]
phishing-triage = "phishing_triage.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.mypy]
strict = true
files = ["src", "tests"]
