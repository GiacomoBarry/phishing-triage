# Settings for Phishing Triage.
#
# These are the defaults. To tune them, copy this file, edit the copy and
# run:  phishing-triage email.eml --settings path/to/your-copy.toml

# The lowest Score that gives each Verdict. Anything lower is clean.
[verdict]
suspicious_from = 30
malicious_from = 60

# Points each Finding adds to the Score. The Score is capped at 100.
# Decisive Findings (such as a URL listed on URLhaus) need no points: they
# make the Verdict malicious on their own.
[points]
reply_to_mismatch = 20
display_name_impersonation = 25
lookalike_domain = 30
url_shortener = 10
urgency_language = 10
risky_attachment = 25
urlhaus_domain_listed = 20
virustotal_low_detections = 15
newly_registered_domain = 20
dmarc_fail = 20
spf_fail = 10
dkim_fail = 10
abuseipdb_high_confidence = 15

# Protected Brands: names attackers pretend to be. Each line is a brand name,
# as it would appear in a display name, and the domains genuinely theirs.
# Those domains are the Protected Domains that Lookalike Domains are checked
# against. Add your own organisation the same way, e.g.
#   "Acme" = ["acme.co.uk"]
# List the domain the organisation registered (paypal.com, not
# mail.paypal.com); its subdomains count as genuine automatically.
# Free webmail (gmail.com, outlook.com, icloud.com) is left out on purpose:
# anyone can sign up there and call themselves "Google Security".
[brands]
"Microsoft" = ["microsoft.com", "microsoftonline.com", "office365.com"]
"Google" = ["google.com", "google.co.uk"]
"PayPal" = ["paypal.com", "paypal.co.uk"]
"Apple" = ["apple.com"]
"Amazon" = ["amazon.com", "amazon.co.uk"]
"DHL" = ["dhl.com", "dhl.co.uk", "dhl.de"]
"HMRC" = ["hmrc.gov.uk"]
"Royal Mail" = ["royalmail.com", "royalmail.co.uk"]

# URL shorteners: links through these hide their real destination. They are
# never expanded, because that would mean visiting them. Subdomains count too.
[shorteners]
domains = [
    "bit.ly", "tinyurl.com", "t.co", "goo.gl", "ow.ly", "is.gd", "buff.ly",
    "rebrand.ly", "cutt.ly", "shorturl.at", "tiny.cc", "rb.gy", "t.ly", "s.id",
]

# Urgency Phrases: wording that pressures the reader to act before thinking.
# Any of these in the subject or body adds the urgency_language points once,
# however many match. Case doesn't matter, and a phrase only matches as whole
# words ("act now" doesn't match "contact now"). Single words such as
# "urgent" are left out on purpose: genuine emails use them all the time.
[urgency]
phrases = [
    # Threats to the account
    "account suspended", "account has been suspended", "account will be suspended",
    "account will be closed", "account has been locked", "account locked",
    "account will be deactivated", "will be permanently deleted",
    # Demands to act
    "verify your account", "verify your identity", "confirm your identity",
    "confirm your account", "update your payment", "update your billing",
    "action required", "immediate action required", "act now", "respond immediately",
    # Deadlines
    "within 24 hours", "within 48 hours", "within 12 hours", "expires today",
    "final notice", "final warning", "last chance", "failure to respond",
    # Alarm
    "unusual sign-in activity", "unusual activity", "suspicious activity",
    "unauthorised access", "unauthorized access", "payment failed",
    "your password expires", "your password will expire",
]

# Attachments: extensions (without the dot) that can run code when opened,
# or show a fake login page. Archives and password-protected ZIPs are
# flagged whatever their extension, so they aren't listed here.
[attachments]
risky_extensions = [
    # Programs and scripts
    "exe", "scr", "com", "pif", "bat", "cmd", "ps1", "vbs", "vbe", "js", "jse",
    "wsf", "wsh", "hta", "msi", "lnk", "jar",
    # Disk images, which can smuggle the above past filters
    "iso", "img", "vhd", "vhdx",
    # OneNote, and Office files that can carry macros
    "one", "docm", "xlsm", "pptm",
    # Web pages and images that can contain a fake login form or script
    "html", "htm", "shtml", "svg",
]

# VirusTotal: how many engines must flag a URL or attachment as malicious
# before it is a Decisive Finding (the Verdict is then malicious whatever the
# Score). Fewer, but at least one, adds the virustotal_low_detections points
# instead. Even google.com gets the odd detection, so 1 would be far too
# jumpy. A flagged domain only ever adds those points, never decides.
[virustotal]
decisive_engines = 3

# Reputation Lookups: the most URLs looked up per email, so a link-heavy
# email finishes in reasonable time on free API keys. URLs over the cap are
# Not Checked, so the email can't be called clean. Domains are looked up
# first and aren't capped, so capped URLs usually still have their domain checked.
[lookups]
url_cap = 10

# RDAP: a sender or link domain registered fewer than this many days ago
# gives the newly_registered_domain points. Phishing domains are often only
# days old. A registry that hides the date gives "unknown age", which never
# counts as old or new.
[rdap]
new_domain_days = 30

# Trusted Relays: mail servers whose Received headers you believe, normally
# your organisation's own mail gateway. Subdomains count too. The sender can
# forge any Received header added before the email reached a server you
# trust, so without Trusted Relays the Claimed Origin (the earliest public IP
# in the chain) is labelled unverified. With them, it is the IP your own
# server recorded. For example:
#   trusted_relays = ["mx.acme.co.uk"]
# or, for Microsoft 365:
#   trusted_relays = ["protection.outlook.com"]
[received]
trusted_relays = []

# AbuseIPDB: how sure AbuseIPDB must be (0-100%) that the Claimed Origin's IP
# is abusive before it adds the abuseipdb_high_confidence points. The score
# comes from other people's reports over the last 30 days. Shared hosting and
# VPN addresses often sit at middling scores, so a low threshold is noisy.
[abuseipdb]
confidence_threshold = 75
